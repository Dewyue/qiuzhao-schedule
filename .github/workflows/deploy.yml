name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Domestic production: Aliyun nginx (qiuzhao.dewyue.com)
  # Secrets live in environment "ALIYUN_SSH_KEY" (created in repo Settings → Environments).
  deploy-aliyun:
    needs: build
    runs-on: ubuntu-latest
    environment: ALIYUN_SSH_KEY
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Sync dist to Aliyun
        env:
          HOST: ${{ secrets.ALIYUN_HOST }}
          USER: ${{ secrets.ALIYUN_USER }}
          KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          PATH_REMOTE: ${{ secrets.ALIYUN_PATH }}
          PORT: ${{ secrets.ALIYUN_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${KEY:-}" ] || [ -z "${PATH_REMOTE:-}" ]; then
            echo "::error::缺少阿里云部署 Secrets。请在仓库 Settings → Secrets 配置 ALIYUN_HOST / ALIYUN_USER / ALIYUN_SSH_KEY / ALIYUN_PATH"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes" \
            dist/ "${USER}@${HOST}:${PATH_REMOTE}/"

  # Optional mirror: github.io (overseas; not for daily China use)
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
