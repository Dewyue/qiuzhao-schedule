name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Domestic production: Aliyun nginx (qiuzhao.dewyue.com)
  # Secrets live in environment "ALIYUN_SSH_KEY" (created in repo Settings → Environments).
  deploy-aliyun:
    needs: build
    runs-on: ubuntu-latest
    environment: ALIYUN_SSH_KEY
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Sync dist to Aliyun
        env:
          HOST: ${{ secrets.ALIYUN_HOST }}
          USER: ${{ secrets.ALIYUN_USER }}
          KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          PATH_REMOTE: ${{ secrets.ALIYUN_PATH }}
          PORT: ${{ secrets.ALIYUN_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${KEY:-}" ] || [ -z "${PATH_REMOTE:-}" ]; then
            echo "::error::缺少阿里云部署 Secrets。请在仓库 Settings → Secrets 配置 ALIYUN_HOST / ALIYUN_USER / ALIYUN_SSH_KEY / ALIYUN_PATH"
            exit 1
          fi
          mkdir -p ~/.ssh
          # Normalize common paste issues: literal \n, CRLF, leading/trailing junk.
          printf '%s' "$KEY" \
            | sed 's/\r$//' \
            | sed 's/\\n/\n/g' \
            > ~/.ssh/deploy_key
          # Ensure trailing newline (OpenSSH requires it)
          [ -n "$(tail -c1 ~/.ssh/deploy_key)" ] && echo >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::ALIYUN_SSH_KEY 不是有效私钥。请在服务器执行 cat ~/.ssh/qiuzhao_deploy，把私钥全文（含 BEGIN/END）重新贴进 Environment Secret。"
            exit 1
          fi
          PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH=(ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30)
          rsync -avz --delete \
            -e "${SSH[*]}" \
            dist/ "${USER}@${HOST}:${PATH_REMOTE}/"
          # nginx (www-data) must traverse + read; otherwise stat() → Permission denied → HTTP 500.
          "${SSH[@]}" "${USER}@${HOST}" bash -s -- "$PATH_REMOTE" <<'EOS'
          set -euo pipefail
          PATH_REMOTE="$1"
          PARENT="$(dirname "$PATH_REMOTE")"
          chmod 755 "$PARENT" "$PATH_REMOTE"
          chmod -R a+rX "$PATH_REMOTE"
          chown -R www-data:www-data "$PATH_REMOTE" 2>/dev/null || chown -R root:root "$PATH_REMOTE" 2>/dev/null || true
          if command -v nginx >/dev/null 2>&1; then
            nginx -t || sudo nginx -t || true
            systemctl reload nginx 2>/dev/null || sudo systemctl reload nginx 2>/dev/null || true
          fi
          ls -lad "$PARENT" "$PATH_REMOTE"
          EOS

  # Optional mirror: github.io (overseas; not for daily China use)
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
